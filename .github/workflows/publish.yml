name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI Trusted Publishing, so no API
# token is stored in this repository. One-time setup on PyPI is described in the README.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
